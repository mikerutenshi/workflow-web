services:
  backend:
    build:
      context: ./backend
      target: staging
    image: mikerutenshi/workflow-backend:latest
    container_name: backend
    restart: always
    environment:
      NODE_ENV: production
      WAIT_HOSTS: postgres:5432
    depends_on:
      - postgres
    ports:
      - 3006:3001
    networks:
      - workflow-network
  frontend:
    build:
      context: ./frontend
      args:
        - ENVIRONMENT=staging
    image: mikerutenshi/workflow-frontend:latest
    container_name: frontend
    restart: always
    depends_on:
      - backend
    ports:
      - 3005:80
    networks:
      - workflow-network
    environment:
      NODE_ENV: production
    # volumes:
    #   - ./frontend/nginx/conf.d:/etc/nginx/conf.d
  nginx:
    image: nginx:1.27.4-alpine
    container_name: nginx
    volumes:
      - ./nginx-staging/conf.d-https:/etc/nginx/conf.d
      - ./nginx-staging/snippets:/etc/nginx/snippets
      - ./nginx-staging/ssl/certs/dhparam.pem:/etc/ssl/certs/dhparam.pem
      - ./nginx-staging/ssl/certs/nginx-selfsigned.crt:/etc/ssl/certs/nginx-selfsigned.crt
      - ./nginx-staging/ssl/certs/nginx-selfsigned.key:/etc/ssl/certs/nginx-selfsigned.key
    depends_on:
      - frontend
    networks:
      - workflow-network
    ports:
      - 443:443
      - 80:80
    restart: unless-stopped
  postgres:
    image: postgres:15.12-alpine
    container_name: postgres
    networks:
      - workflow-network
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DATABASE: ${POSTGRES_DATABASE}
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:

networks:
  workflow-network:
    driver: bridge
