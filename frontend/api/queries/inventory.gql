fragment Inventory on Inventory {
  id
  name
  address
  city
  province
  type
}

mutation createInventory($data: InventoryCreateDto!) {
  createInventory(data: $data) {
    id
  }
}

query getInventories {
  getInventories {
    ...Inventory
  }
}

query getInventory($id: ID!) {
  getInventory(id: $id) {
    ...Inventory
  }
}

mutation updateInventory($id: ID!, $data: InventoryUpdateDto!) {
  updateInventory(id: $id, data: $data) {
    id
  }
}

mutation deleteInventory($id: ID!) {
  deleteInventory(id: $id)
}

mutation createInvProduct($data: InvProductCreateDto!) {
  createInvProduct(data: $data) {
    invId
    productId
  }
}

query getInvProducts($invId: ID!) {
  getInvProducts(invId: $invId) {
    invId
    productId
    product {
      id
      sku
      productGroup {
        id
        name
        productCategory {
          ...ProductCategory
        }
      }
      productColors {
        color {
          ...Color
        }
      }
    }
    invProductSizes {
      size {
        ...Size
      }
      quantity
    }
    sellingPrice
    discount
  }
}

mutation updateInvProduct(
  $invId: ID!
  $productId: ID!
  $data: InvProductUpdateDto!
) {
  updateInvProduct(invId: $invId, productId: $productId, data: $data) {
    invId
    productId
  }
}

mutation deleteInvProduct($invId: ID!, $productId: ID!) {
  deleteInvProduct(invId: $invId, productId: $productId)
}

query getInvTrfsPerItem($invId: ID!, $productId: ID!) {
  getInvTrfsPerItem(invId: $invId, productId: $productId) {
    invTrfId
    productId
    invTrfItemSizes {
      invTrfId
      productId
      sizeId
      size {
        ...Size
      }
      quantity
    }
    invTrf {
      trfNo
      fromInvId
      toInvId
      trfDate
      progress
      fromInv {
        name
        type
      }
      toInv {
        name
        type
      }
    }
  }
}

query getInvTrfs {
  getInvTrfs {
    trfNo
    fromInv {
      name
      type
    }
    toInv {
      name
      type
    }
    trfDate
    progress
    invTrfItems {
      product {
        sku
      }
      invTrfItemSizes {
        invTrfId
        productId
        sizeId
        size {
          ...Size
        }
        quantity
      }
    }
  }
}
