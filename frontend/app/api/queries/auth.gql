fragment AuthUser on User {
  id
  email
  firstName
  lastName
  createdAt
  role {
    name
    clearanceLevel
  }
}
mutation createUser($data: UserCreateDto!) {
  createUser(data: $data) {
    ...AuthUser
  }
}

mutation logIn($data: LogInDto!) {
  logIn(data: $data) {
    ...AuthUser
  }
}

mutation logOut {
  logOut {
    ...AuthUser
  }
}

query me {
  me {
    ...AuthUser
  }
}

query getUsers {
  getUsers {
    ...AuthUser
  }
}

query getRoles {
  getRoles {
    id
    name
    description
  }
}
